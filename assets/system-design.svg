<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#151D29" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="640" rx="18"/></clipPath>
    
  </defs>
  <style>
    .sans{font-family:'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
    
      .march{animation:march 1.2s linear infinite}
      @keyframes march{to{stroke-dashoffset:-22}}
      .hb{animation:hb 2s ease-out infinite;transform-origin:365px 245px}
      @keyframes hb{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.4)}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="640" fill="#0A0E14"/>
    
    <rect width="1200" height="640" fill="url(#grid)" opacity=".8"/>
    <path d="M18 32V18H32" stroke="#4A5768" stroke-width="1.5"/><path d="M1182 32V18H1168" stroke="#4A5768" stroke-width="1.5"/><path d="M18 608V622H32" stroke="#4A5768" stroke-width="1.5"/><path d="M1182 608V622H1168" stroke="#4A5768" stroke-width="1.5"/>
    <text x="48" y="64" class="mono" font-size="13" fill="#F5B841" letter-spacing="2">EVOLUTIONARY ARCHITECTURE</text>
    <text x="48" y="96" class="sans" font-size="24" font-weight="700" fill="#E6EDF3">Start on one $2 server. Add a component only when something breaks.</text>
    <text x="1152" y="64" text-anchor="end" class="mono" font-size="12" fill="#4A5768">live traffic simulation</text>

    <g stroke-width="1.6">
      <path d="M210 245H290" stroke="#223044"/>
      <path d="M440 245C475 245 475 145 520 145" stroke="#223044"/><path d="M440 245C475 245 475 345 520 345" stroke="#223044"/>
      <path d="M680 145H770" stroke="#223044"/><path d="M680 345H770" stroke="#223044"/>
      <path d="M680 160C720 160 730 330 770 330" stroke="#223044" stroke-dasharray="3 5"/><path d="M680 330C720 330 730 160 770 160" stroke="#223044" stroke-dasharray="3 5"/>
      <path d="M930 345H1010" stroke="#A78BFA" stroke-opacity=".6" stroke-dasharray="6 5" class="march"/>
      <path d="M930 320C970 320 960 160 1010 160" stroke="#FF7A6B" stroke-opacity=".6" stroke-dasharray="6 5" class="march"/>
    </g>

    
    <g class="">
      <rect x="60" y="210" width="150" height="70" rx="10" fill="#0F141C" stroke="#8B98A9" stroke-opacity=".75" stroke-width="1.5"/>
      <text x="135" y="243" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">Users</text>
      <text x="135" y="262" text-anchor="middle" class="mono" font-size="11" fill="#8B98A9">web / mobile</text>
    </g>
    
    <g class="lb">
      <rect x="290" y="210" width="150" height="70" rx="10" fill="#0F141C" stroke="#5EEAD4" stroke-opacity=".75" stroke-width="1.5"/>
      <text x="365" y="243" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">Load Balancer</text>
      <text x="365" y="262" text-anchor="middle" class="mono" font-size="11" fill="#8B98A9">round robin + health</text>
    </g>
    
    <g class="">
      <rect x="520" y="110" width="160" height="70" rx="10" fill="#0F141C" stroke="#5EEAD4" stroke-opacity=".75" stroke-width="1.5"/>
      <text x="600" y="143" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">App Server A</text>
      <text x="600" y="162" text-anchor="middle" class="mono" font-size="11" fill="#8B98A9">stateless</text>
    </g>
    
    <g class="">
      <rect x="520" y="310" width="160" height="70" rx="10" fill="#0F141C" stroke="#5EEAD4" stroke-opacity=".75" stroke-width="1.5"/>
      <text x="600" y="343" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">App Server B</text>
      <text x="600" y="362" text-anchor="middle" class="mono" font-size="11" fill="#8B98A9">stateless</text>
    </g>
    
    <g class="">
      <rect x="770" y="110" width="160" height="70" rx="10" fill="#0F141C" stroke="#F5B841" stroke-opacity=".75" stroke-width="1.5"/>
      <text x="850" y="143" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">Cache</text>
      <text x="850" y="162" text-anchor="middle" class="mono" font-size="11" fill="#8B98A9">hot reads in RAM</text>
    </g>
    
    <g class="">
      <rect x="770" y="310" width="160" height="70" rx="10" fill="#0F141C" stroke="#7EE787" stroke-opacity=".75" stroke-width="1.5"/>
      <text x="850" y="343" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">Database</text>
      <text x="850" y="362" text-anchor="middle" class="mono" font-size="11" fill="#8B98A9">primary</text>
    </g>
    
    <g class="">
      <rect x="1010" y="310" width="150" height="70" rx="10" fill="#0F141C" stroke="#A78BFA" stroke-opacity=".75" stroke-width="1.5"/>
      <text x="1085" y="343" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">Replica</text>
      <text x="1085" y="362" text-anchor="middle" class="mono" font-size="11" fill="#8B98A9">async, read-only</text>
    </g>
    
    <g class="">
      <rect x="1010" y="125" width="150" height="70" rx="10" fill="#0F141C" stroke="#FF7A6B" stroke-opacity=".75" stroke-width="1.5"/>
      <text x="1085" y="158" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">Backups</text>
      <text x="1085" y="177" text-anchor="middle" class="mono" font-size="11" fill="#8B98A9">daily snapshots</text>
    </g>
    <text x="970" y="365" text-anchor="middle" class="mono" font-size="10" fill="#4A5768">replicate</text>
    <rect x="290" y="210" width="150" height="70" rx="10" stroke="#5EEAD4" stroke-width="2" class="hb"/>

    <circle r="4.5" fill="#E6EDF3" opacity="0">
      <animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M210 245H290"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
    </circle><circle r="4.5" fill="#E6EDF3" opacity="0">
      <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M210 245H290"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#5EEAD4" opacity="0">
      <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M440 245C475 245 475 145 520 145"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle><circle r="4.5" fill="#5EEAD4" opacity="0">
      <animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M440 245C475 245 475 345 520 345"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#F5B841" opacity="0">
      <animateMotion dur="1.2s" begin="0.9s" repeatCount="indefinite" path="M680 145H770"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
    </circle><circle r="4.5" fill="#F5B841" opacity="0">
      <animateMotion dur="1.8s" begin="1.7s" repeatCount="indefinite" path="M680 330C720 330 730 160 770 160"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#7EE787" opacity="0">
      <animateMotion dur="1.4s" begin="1.5s" repeatCount="indefinite" path="M680 345H770"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.4s" begin="1.5s" repeatCount="indefinite"/>
    </circle><circle r="4.5" fill="#7EE787" opacity="0">
      <animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M680 160C720 160 730 330 770 330"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#A78BFA" opacity="0">
      <animateMotion dur="1.8s" begin="0.3s" repeatCount="indefinite" path="M930 345H1010"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle><circle r="3.5" fill="#FF7A6B" opacity="0">
      <animateMotion dur="3.5s" begin="1s" repeatCount="indefinite" path="M930 320C970 320 960 160 1010 160"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.5s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <g class="mono" font-size="11">
      <rect x="48" y="412" width="12" height="3" fill="#F5B841"/><text x="68" y="417" fill="#8B98A9">cache hit</text>
      <rect x="160" y="412" width="12" height="3" fill="#7EE787"/><text x="180" y="417" fill="#8B98A9">cache miss, read from DB</text>
      <rect x="380" y="412" width="12" height="3" fill="#A78BFA"/><text x="400" y="417" fill="#8B98A9">replication</text>
      <rect x="510" y="412" width="12" height="3" fill="#FF7A6B"/><text x="530" y="417" fill="#8B98A9">backup stream</text>
    </g>
    <path d="M48 440H1152" stroke="#223044"/>

    
    <g transform="translate(48 470)">
      <rect width="360" height="138" rx="12" fill="#0F141C" stroke="#223044"/>
      <rect width="4" height="138" rx="2" fill="#5EEAD4"/>
      <text x="24" y="32" class="mono" font-size="12" fill="#5EEAD4" letter-spacing="2">FAILURE 01</text>
      <text x="24" y="60" class="sans" font-size="18" font-weight="700" fill="#E6EDF3">CPU and RAM saturated</text>
      <text x="24" y="88" class="sans" font-size="14" fill="#8B98A9"><tspan fill="#5EEAD4">fix</tspan>   second server behind a load balancer</text>
      <text x="24" y="114" class="sans" font-size="14" fill="#8B98A9"><tspan fill="#F5B841">cost</tspan>  servers must stay stateless</text>
    </g>
    
    <g transform="translate(420 470)">
      <rect width="360" height="138" rx="12" fill="#0F141C" stroke="#223044"/>
      <rect width="4" height="138" rx="2" fill="#F5B841"/>
      <text x="24" y="32" class="mono" font-size="12" fill="#F5B841" letter-spacing="2">FAILURE 02</text>
      <text x="24" y="60" class="sans" font-size="18" font-weight="700" fill="#E6EDF3">Database overloaded</text>
      <text x="24" y="88" class="sans" font-size="14" fill="#8B98A9"><tspan fill="#5EEAD4">fix</tspan>   cache the popular data in memory</text>
      <text x="24" y="114" class="sans" font-size="14" fill="#8B98A9"><tspan fill="#F5B841">cost</tspan>  invalidation and stale reads</text>
    </g>
    
    <g transform="translate(792 470)">
      <rect width="360" height="138" rx="12" fill="#0F141C" stroke="#223044"/>
      <rect width="4" height="138" rx="2" fill="#FF7A6B"/>
      <text x="24" y="32" class="mono" font-size="12" fill="#FF7A6B" letter-spacing="2">FAILURE 03</text>
      <text x="24" y="60" class="sans" font-size="18" font-weight="700" fill="#E6EDF3">The machine dies</text>
      <text x="24" y="88" class="sans" font-size="14" fill="#8B98A9"><tspan fill="#5EEAD4">fix</tspan>   replication and backups, no single point</text>
      <text x="24" y="114" class="sans" font-size="14" fill="#8B98A9"><tspan fill="#F5B841">cost</tspan>  replica lag, failover logic</text>
    </g>
  
  </g>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="18" stroke="#223044"/>
</svg>
