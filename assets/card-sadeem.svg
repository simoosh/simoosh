<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#151D29" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="600" height="400" rx="18"/></clipPath>
    <radialGradient id="planet" cx=".35" cy=".35"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#C77D12"/></radialGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .bar{transform-origin:0 0;animation:bar 1.4s cubic-bezier(.6,.05,.3,1) .3s both}
      @keyframes bar{from{transform:scaleX(0)}} 
    .orbC{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.3}}
    .star{animation:pulse 3s ease-in-out infinite}
  </style>
  <g clip-path="url(#card)">
    <rect width="600" height="400" fill="#0A0E14"/>
    
    <rect width="600" height="210" fill="#0F141C"/>
    <rect width="600" height="210" fill="url(#grid)" opacity=".7"/>
    
    <g transform="translate(300 122)">
      <ellipse rx="150" ry="44" stroke="#223044" stroke-width="1.3"/>
      <ellipse rx="230" ry="62" stroke="#223044" stroke-width="1.1" stroke-dasharray="3 6"/>
      <circle r="30" fill="url(#planet)"/>
      <ellipse rx="44" ry="10" stroke="#F5B841" stroke-opacity=".7" stroke-width="2" transform="rotate(-14)"/>
      <circle r="9" fill="#5EEAD4"><animateMotion dur="7s" repeatCount="indefinite" path="M150 0A150 44 0 1 1 -150 0A150 44 0 1 1 150 0"/></circle>
      <circle r="7" fill="#A78BFA"><animateMotion dur="13s" repeatCount="indefinite" path="M-230 0A230 62 0 1 0 230 0A230 62 0 1 0 -230 0"/></circle>
      <g class="orbC"><circle cx="0" cy="44" r="5" fill="#FF7A6B"/></g>
    </g>
    <text x="24" y="30" class="mono" font-size="11" fill="#8B98A9">STREAK 12  /  XP 2,480  /  HEARTS 5</text>
    <circle cx="0" cy="20" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:0.00s"/><circle cx="97" cy="73" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:0.23s"/><circle cx="194" cy="126" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:0.46s"/><circle cx="291" cy="179" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:0.69s"/><circle cx="388" cy="52" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:0.92s"/><circle cx="485" cy="105" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:1.15s"/><circle cx="582" cy="158" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:1.38s"/><circle cx="79" cy="31" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:1.61s"/><circle cx="176" cy="84" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:1.84s"/><circle cx="273" cy="137" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:2.07s"/><circle cx="370" cy="190" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:2.30s"/><circle cx="467" cy="63" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:2.53s"/><circle cx="564" cy="116" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:2.76s"/><circle cx="61" cy="169" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:2.99s"/><circle cx="158" cy="42" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:3.22s"/><circle cx="255" cy="95" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:3.45s"/><circle cx="352" cy="148" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:3.68s"/><circle cx="449" cy="21" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:3.91s"/><circle cx="546" cy="74" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:4.14s"/><circle cx="43" cy="127" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:4.37s"/><circle cx="140" cy="180" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:4.60s"/><circle cx="237" cy="53" r="1.2" fill="#E6EDF3" class="star" style="animation-delay:4.83s"/>
    <path d="M0 210H600" stroke="#223044"/>
    <rect x="0" y="209" width="600" height="2" fill="#F5B841" class="bar"/>
    <text x="28" y="248" class="mono" font-size="12" fill="#F5B841" letter-spacing="2.5">GAMIFIED LEARNING  /  2ND PLACE NATIONAL</text>
    <text x="28" y="282" class="sans" font-size="27" font-weight="700" fill="#E6EDF3">Sadeem</text>
    <text x="28" y="310" class="sans" font-size="14.5" fill="#8B98A9">Arabic-first learning platform for ages 5 to 17: XP, streaks,</text><text x="28" y="331" class="sans" font-size="14.5" fill="#8B98A9">hearts, 6 mini-game types, student, teacher and parent spaces.</text>
    <rect x="28" y="356" width="56.5" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="56.25" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">React</text><rect x="92.5" y="356" width="41.9" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="113.45" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">R3F</text><rect x="142.4" y="356" width="71.1" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="177.95" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">Express</text><rect x="221.5" y="356" width="71.1" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="257.05" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">MongoDB</text><rect x="300.6" y="356" width="41.9" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="321.55" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">JWT</text>
  
  </g>
  <rect x="0.5" y="0.5" width="599" height="399" rx="18" stroke="#223044"/>
</svg>
