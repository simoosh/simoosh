    <text x="320" y="80.5" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">4</text>
    <circle cx="400" cy="128" r="17" fill="#121925" stroke="#223044" stroke-width="2"/>
    <circle cx="400" cy="128" r="17" fill="none" stroke="#A78BFA" stroke-width="2.5" class="lit" style="animation-delay:2.0s"/>
    <text x="400" y="132.5" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">5</text>
    <circle cx="470" cy="66" r="17" fill="#121925" stroke="#223044" stroke-width="2"/>
    <circle cx="470" cy="66" r="17" fill="none" stroke="#A78BFA" stroke-width="2.5" class="lit" style="animation-delay:2.5s"/>
    <text x="470" y="70.5" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">6</text>
    <circle cx="540" cy="110" r="17" fill="#121925" stroke="#223044" stroke-width="2"/>
    <circle cx="540" cy="110" r="17" fill="none" stroke="#A78BFA" stroke-width="2.5" class="lit" style="animation-delay:3.0s"/>
    <text x="540" y="114.5" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">7</text>
      <text x="24" y="30" class="mono" font-size="11" fill="#8B98A9">ROADMAP  /  LEVELS  /  LEADERBOARD</text>
      <rect x="380" y="172" width="196" height="10" rx="5" fill="#121925" stroke="#223044"/>
      <rect x="380" y="172" width="196" height="10" rx="5" fill="#A78BFA" class="xp"/>
      <text x="372" y="181" text-anchor="end" class="mono" font-size="10" fill="#8B98A9">XP</text>
    <path d="M0 210H600" stroke="#223044"/>
    <rect x="0" y="209" width="600" height="2" fill="#A78BFA" class="bar"/>
    <text x="28" y="248" class="mono" font-size="12" fill="#A78BFA" letter-spacing="2.5">EDTECH  /  GAMES HUB  /  NEXT.JS</text>
    <text x="28" y="282" class="sans" font-size="27" font-weight="700" fill="#E6EDF3">Wladz</text>
    <text x="28" y="310" class="sans" font-size="14.5" fill="#8B98A9">Hub of educational games for Algerian kids aged 7 to 15:</text><text x="28" y="331" class="sans" font-size="14.5" fill="#8B98A9">prevention, civics, history. Built for the Ministry of Youth.</text>
    <rect x="28" y="356" width="71.1" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="63.55" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">Next.js</text><rect x="107.1" y="356" width="78.4" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="146.3" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">Three.js</text><rect x="193.5" y="356" width="49.2" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="218.1" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">GSAP</text><rect x="250.7" y="356" width="100.3" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="300.84999999999997" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">SQLite auth</text><rect x="359" y="356" width="78.4" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="398.2" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">Tailwind</text>
  
  </g>
  <rect x="0.5" y="0.5" width="599" height="399" rx="18" stroke="#223044"/>
