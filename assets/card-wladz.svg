<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#151D29" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="600" height="400" rx="18"/></clipPath>
    
  </defs>
  <style>
    .sans{font-family:'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .bar{transform-origin:0 0;animation:bar 1.4s cubic-bezier(.6,.05,.3,1) .3s both}
      @keyframes bar{from{transform:scaleX(0)}} 
      .road{animation:road 5s ease-in-out infinite}
      @keyframes road{0%{stroke-dasharray:700;stroke-dashoffset:700}70%,100%{stroke-dasharray:700;stroke-dashoffset:0}}
      .lit{animation:lit 5s ease-in-out infinite both}
      @keyframes lit{0%{opacity:0}8%,80%{opacity:1}100%{opacity:0}}
      .xp{transform-origin:380px 0;animation:xp 5s ease-in-out infinite}
      @keyframes xp{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
  </style>
  <g clip-path="url(#card)">
    <rect width="600" height="400" fill="#0A0E14"/>
    
    <rect width="600" height="210" fill="#0F141C"/>
    <rect width="600" height="210" fill="url(#grid)" opacity=".7"/>
    
      <path d="M70 150L150 92L240 140L320 76L400 128L470 66L540 110" stroke="#223044" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
      <path d="M70 150L150 92L240 140L320 76L400 128L470 66L540 110" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" class="road"/>
      
    <circle cx="70" cy="150" r="17" fill="#121925" stroke="#223044" stroke-width="2"/>
