    <circle cx="150" cy="92" r="17" fill="none" stroke="#A78BFA" stroke-width="2.5" class="lit" style="animation-delay:0.5s"/>
    <text x="150" y="96.5" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">2</text>
    <circle cx="240" cy="140" r="17" fill="#121925" stroke="#223044" stroke-width="2"/>
    <circle cx="240" cy="140" r="17" fill="none" stroke="#A78BFA" stroke-width="2.5" class="lit" style="animation-delay:1.0s"/>
    <text x="240" y="144.5" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">3</text>
    <circle cx="320" cy="76" r="17" fill="#121925" stroke="#223044" stroke-width="2"/>
