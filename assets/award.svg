<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#151D29" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="208" rx="18"/></clipPath>
    
      <radialGradient id="awardGlow" cx=".1" cy=".5" r=".55"><stop offset="0" stop-color="#F5B841" stop-opacity=".16"/><stop offset="1" stop-color="#F5B841" stop-opacity="0"/></radialGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#F5B841"/></linearGradient>
      <linearGradient id="border" x1="0" x2="1"><stop offset="0" stop-color="#F5B841"/><stop offset=".5" stop-color="#223044"/><stop offset="1" stop-color="#5EEAD4" stop-opacity=".6"/></linearGradient>
      <linearGradient id="shine" x1="0" x2="1" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#E6EDF3"/><stop offset=".45" stop-color="#E6EDF3"/>
        <stop offset=".5" stop-color="#FFE29A"/><stop offset=".55" stop-color="#E6EDF3"/><stop offset="1" stop-color="#E6EDF3"/>
        <animate attributeName="x1" values="-1;1" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="0;2" dur="4.5s" repeatCount="indefinite"/>
      </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
    
      .orbit{transform-origin:0 0;animation:spin 6s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="208" fill="#0A0E14"/>
    
    <rect width="1200" height="208" fill="url(#grid)" opacity=".6"/>
    <rect x="0" y="0" width="1200" height="208" fill="url(#awardGlow)"/>
    <rect x="0" y="0" width="4" height="208" fill="#F5B841"/>
    <g transform="translate(128 104)">
      <circle r="58" stroke="#F5B841" stroke-opacity=".25" stroke-width="1.5"/>
      <circle r="58" stroke="#F5B841" stroke-width="2.5" stroke-dasharray="40 325" class="orbit"/>
      <circle r="44" fill="#0F141C" stroke="#F5B841" stroke-opacity=".6"/>
      <text y="14" text-anchor="middle" class="sans" font-size="40" font-weight="800" fill="url(#gold)">2</text>
      <text x="17" y="-8" class="sans" font-size="15" font-weight="700" fill="#F5B841">ND</text>
    </g>
    <text x="224" y="68" class="mono" font-size="13" fill="#F5B841" letter-spacing="3">SECOND PLACE  /  NATIONAL LEVEL</text>
    <text x="224" y="112" class="sans" font-size="31" font-weight="700" fill="url(#shine)">National Hackathon for Innovation and Digital Design</text>
    <text x="224" y="146" class="sans" font-size="16" fill="#8B98A9">Mostaganem, Algeria  <tspan fill="#4A5768">|</tspan>  Project: <tspan fill="#E6EDF3">Sadeem</tspan>, a gamified learning platform for Algerian youth</text>
    <text x="1136" y="68" text-anchor="end" class="sans" font-size="15" fill="#8B98A9">&#1575;&#1604;&#1607;&#1575;&#1603;&#1575;&#1579;&#1608;&#1606; &#1575;&#1604;&#1608;&#1591;&#1606;&#1610; &#1604;&#1604;&#1575;&#1576;&#1578;&#1603;&#1575;&#1585; &#1608;&#1575;&#1604;&#1578;&#1589;&#1605;&#1610;&#1605; &#1575;&#1604;&#1585;&#1602;&#1605;&#1610;</text>
  
  </g>
  <rect x="0.5" y="0.5" width="1199" height="207" rx="18" stroke="#223044"/>
</svg>
