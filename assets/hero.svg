    <text x="1140" y="58" text-anchor="end" class="mono" font-size="13" fill="#8B98A9" letter-spacing="2">36.75&#176;N  5.06&#176;E  BÉJAÏA, ALGERIA</text>

    <g class="name sans">
      <text x="56" y="168" font-size="96" font-weight="800" letter-spacing="2" textLength="1088" lengthAdjust="spacingAndGlyphs">SLIMANE SAHNOUNE</text>
    </g>

    <g class="role">
      <text x="60" y="218" class="mono" font-size="21" fill="#F5B841" letter-spacing=".5">Full-Stack Developer <tspan fill="#4A5768">/</tspan> System Design <tspan fill="#4A5768">/</tspan> AI Integration</text>
      <rect class="typer" x="58" y="194" width="760" height="34" fill="#0A0E14"/>
