<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#151D29" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="448" rx="18"/></clipPath>
    
      <radialGradient id="gA"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".2"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
      <radialGradient id="gB"><stop offset="0" stop-color="#F5B841" stop-opacity=".12"/><stop offset="1" stop-color="#F5B841" stop-opacity="0"/></radialGradient>
      <linearGradient id="nameFill" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDE6EF"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
    
      .name text{fill:url(#nameFill);stroke:#5EEAD4;stroke-width:0;
        animation:draw 2.2s cubic-bezier(.6,.05,.3,1) both, fill 1s ease 1.8s both}
      @keyframes draw{from{stroke-dasharray:1400;stroke-dashoffset:1400}to{stroke-dasharray:1400;stroke-dashoffset:0}}
      @keyframes fill{from{fill-opacity:0;stroke-width:1.2}to{fill-opacity:1;stroke-width:0}}
      .typer{opacity:0;animation:type 2.2s steps(52, jump-start) 1.9s both}
      @keyframes type{from{transform:none;opacity:1}99.9%{opacity:1}to{transform:translateX(780px);opacity:0}}
      .fadeIn{animation:fadein .8s ease 3.9s both}
      @keyframes fadein{from{opacity:0}}
      .rule{animation:rule 1.2s cubic-bezier(.6,.05,.3,1) 2.2s both}
      @keyframes rule{from{stroke-dasharray:1072;stroke-dashoffset:1072}to{stroke-dasharray:1072;stroke-dashoffset:0}}
      .stat{animation:stat .7s ease both}
      @keyframes stat{from{opacity:0;transform:translateY(8px)}}
      .glowA{animation:breathe 7s ease-in-out infinite}
      .glowB{animation:breathe 9s ease-in-out infinite reverse}
      @keyframes breathe{50%{opacity:.45}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="448" fill="#0A0E14"/>
    
    <rect width="1200" height="448" fill="url(#grid)" opacity=".9"/>
    <circle class="glowA" cx="1000" cy="40" r="280" fill="url(#gA)"/>
    <circle class="glowB" cx="120" cy="420" r="300" fill="url(#gB)"/>
    <path d="M18 32V18H32" stroke="#4A5768" stroke-width="1.5"/><path d="M1182 32V18H1168" stroke="#4A5768" stroke-width="1.5"/><path d="M18 416V430H32" stroke="#4A5768" stroke-width="1.5"/><path d="M1182 416V430H1168" stroke="#4A5768" stroke-width="1.5"/>

    <text x="64" y="64" class="mono" font-size="13" fill="#8B98A9" letter-spacing="2">SYS://PROFILE <tspan fill="#5EEAD4">ONLINE</tspan></text>
    <text x="1136" y="64" text-anchor="end" class="mono" font-size="13" fill="#8B98A9" letter-spacing="2">36.75&#176;N  5.06&#176;E  BÉJAÏA, ALGERIA</text>

    <g class="name sans">
      <text x="60" y="168" font-size="92" font-weight="800" letter-spacing="2" textLength="1076" lengthAdjust="spacingAndGlyphs">SLIMANE SAHNOUNE</text>
    </g>

    <g class="role">
      <text x="64" y="216" class="mono" font-size="21" fill="#F5B841" letter-spacing=".5">Full-Stack Developer <tspan fill="#4A5768">/</tspan> System Design <tspan fill="#4A5768">/</tspan> AI Integration</text>
      <rect class="typer" x="62" y="192" width="760" height="34" fill="#0A0E14"/>
    </g>
    <text x="64" y="248" class="sans fadeIn" font-size="17" fill="#8B98A9">Control Engineering student (L2 Automatique), Abderrahmane Mira University of Béjaïa</text>

    <path class="rule" d="M64 296H1136" stroke="#223044"/>
    
      <g class="stat" style="animation-delay:2.60s">
        
        <text x="64" y="360" class="sans" font-size="34" font-weight="700" fill="#F5B841">2nd</text>
        <text x="64" y="382" class="mono" font-size="12.5" fill="#8B98A9" letter-spacing=".5">national hackathon</text>
        <text x="64" y="402" class="mono" font-size="12.5" fill="#4A5768" letter-spacing=".5">Mostaganem</text>
      </g>
      <g class="stat" style="animation-delay:2.75s">
        <path d="M332 328V404" stroke="#223044"/>
        <text x="356" y="360" class="sans" font-size="34" font-weight="700" fill="#E6EDF3">68</text>
        <text x="356" y="382" class="mono" font-size="12.5" fill="#8B98A9" letter-spacing=".5">sites on a touch kiosk</text>
        <text x="356" y="402" class="mono" font-size="12.5" fill="#4A5768" letter-spacing=".5">national expo, Algiers</text>
      </g>
      <g class="stat" style="animation-delay:2.90s">
        <path d="M600 328V404" stroke="#223044"/>
        <text x="624" y="360" class="sans" font-size="34" font-weight="700" fill="#E6EDF3">4</text>
        <text x="624" y="382" class="mono" font-size="12.5" fill="#8B98A9" letter-spacing=".5">upstream contributions</text>
        <text x="624" y="402" class="mono" font-size="12.5" fill="#4A5768" letter-spacing=".5">open source</text>
      </g>
      <g class="stat" style="animation-delay:3.05s">
        <path d="M868 328V404" stroke="#223044"/>
        <text x="892" y="360" class="sans" font-size="34" font-weight="700" fill="#E6EDF3">6+</text>
        <text x="892" y="382" class="mono" font-size="12.5" fill="#8B98A9" letter-spacing=".5">AI providers</text>
        <text x="892" y="402" class="mono" font-size="12.5" fill="#4A5768" letter-spacing=".5">behind one adapter</text>
      </g>
  
  </g>
  <rect x="0.5" y="0.5" width="1199" height="447" rx="18" stroke="#223044"/>
</svg>
