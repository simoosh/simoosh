<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#151D29" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="600" height="400" rx="18"/></clipPath>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .sans{font-family:'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .bar{transform-origin:0 0;animation:bar 1.4s cubic-bezier(.6,.05,.3,1) .3s both}
      @keyframes bar{from{transform:scaleX(0)}} 
    .beam{animation:beam 3.2s ease-in-out infinite}
    @keyframes beam{0%{transform:translateY(0);opacity:0}8%{opacity:.9}50%{transform:translateY(166px);opacity:.9}58%,100%{transform:translateY(166px);opacity:0}}
    .flow path:first-child{animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-11}}
    .typed{animation:typed 3.2s ease-in-out infinite}
    @keyframes typed{0%,40%{opacity:.15}60%,92%{opacity:1}100%{opacity:.15}}
  </style>
  <g clip-path="url(#card)">
    <rect width="600" height="400" fill="#0A0E14"/>
    
    <rect width="600" height="210" fill="#0F141C"/>
    <rect width="600" height="210" fill="url(#grid)" opacity=".7"/>
    
    <g transform="translate(60 28)">
      <rect width="190" height="154" rx="6" fill="#F4EFE4" transform="rotate(-3 95 77)"/>
      <g stroke="#2B3A67" stroke-width="2.2" stroke-linecap="round" fill="none" transform="rotate(-3 95 77)">
        <path d="M18 30c10-6 18 4 26-2s14-5 22 0 16-4 26 1 12-3 20 0"/>
        <path d="M18 56c12-5 20 3 30-1s18-4 28 1"/>
        <path d="M60 84h40M66 102c6-8 12 8 18 0s10 6 14 0"/>
        <path d="M54 92h52"/>
        <path d="M18 128c10-4 20 3 30-1s16-3 26 1 14-4 24 0"/>
      </g>
      <rect class="beam" x="-6" y="-8" width="202" height="6" rx="3" fill="#5EEAD4" opacity=".85" filter="url(#glow)"/>
    </g>
    <g class="flow">
      <path d="M272 105H328" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="5 6"/>
      <path d="M322 98l9 7-9 7" stroke="#5EEAD4" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(350 26)">
      <rect width="196" height="158" rx="6" fill="#FFFFFF"/>
      <rect width="196" height="20" rx="6" fill="#2B579A"/>
      <rect y="12" width="196" height="8" fill="#2B579A"/>
      <text x="10" y="14" class="mono" font-size="9" fill="#FFFFFF">exam_corrige.docx</text>
      <g class="typed">
        <rect x="16" y="34" width="120" height="7" rx="3" fill="#1F2937"/>
        <rect x="16" y="50" width="160" height="5" rx="2.5" fill="#9CA3AF"/>
        <rect x="16" y="62" width="140" height="5" rx="2.5" fill="#9CA3AF"/>
        <text x="98" y="98" text-anchor="middle" font-family="Cambria Math,'Times New Roman',serif" font-style="italic" font-size="17" fill="#111827">x = </text>
        <text x="138" y="88" text-anchor="middle" font-family="Cambria Math,'Times New Roman',serif" font-style="italic" font-size="14" fill="#111827">-b + &#8730;&#916;</text>
        <path d="M112 94h52" stroke="#111827" stroke-width="1.3"/>
        <text x="138" y="110" text-anchor="middle" font-family="Cambria Math,'Times New Roman',serif" font-style="italic" font-size="14" fill="#111827">2a</text>
        <rect x="16" y="126" width="164" height="5" rx="2.5" fill="#9CA3AF"/>
        <rect x="16" y="138" width="110" height="5" rx="2.5" fill="#9CA3AF"/>
      </g>
    </g>
    <path d="M0 210H600" stroke="#223044"/>
    <rect x="0" y="209" width="600" height="2" fill="#5EEAD4" class="bar"/>
    <text x="28" y="248" class="mono" font-size="12" fill="#5EEAD4" letter-spacing="2.5">AI  /  DOCUMENTS  /  PWA</text>
    <text x="28" y="282" class="sans" font-size="27" font-weight="700" fill="#E6EDF3">ProfScanner</text>
    <text x="28" y="310" class="sans" font-size="14.5" fill="#8B98A9">Photo of a handwritten exam in, editable .docx out, with</text><text x="28" y="331" class="sans" font-size="14.5" fill="#8B98A9">native Word equations. Arabic, French and English, any AI model.</text>
    <rect x="28" y="356" width="56.5" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="56.25" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">React</text><rect x="92.5" y="356" width="93" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="139" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">TypeScript</text><rect x="193.5" y="356" width="93" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="240" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">Vision LLM</text><rect x="294.5" y="356" width="100.3" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="344.65" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">MathML&gt;OMML</text><rect x="402.8" y="356" width="41.9" height="24" rx="12" fill="#121925" stroke="#223044"/>
      <text x="423.75" y="372" text-anchor="middle" class="mono" font-size="12" fill="#8B98A9">PWA</text>
  
  </g>
  <rect x="0.5" y="0.5" width="599" height="399" rx="18" stroke="#223044"/>
</svg>
